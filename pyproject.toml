# Dependencies for every environment, each pinned once; uv.lock pins the
# full tree. Not an installable package: the Makefile runs the code with
# PYTHONPATH=src.
[project]
name = "vessel-anomaly"
version = "0.1.0"
description = "Vessel-behaviour anomaly detection from public AIS tracks"
readme = "README.md"
license = "MIT"
# Matches collar-telemetry and the Lambda python3.14 runtime.
requires-python = "==3.14.*"
dependencies = []

[dependency-groups]
# What the pipeline and the cloud service import.
pipeline = [
    "polars==2.0.0",
    "numpy==2.5.4",
    "shapely==2.2.0",
    "scipy==1.18.1",
    "h3==4.5.0",
]
# Exploration, evaluation and figures; never imported by the pipeline.
# duckdb 2.0.0 was released 2026-10-21: pinned, but nothing relies on it yet.
analysis = [
    { include-group = "pipeline" },
    "duckdb==2.0.0",
    "geopandas==1.2.0",
    "movingpandas==0.23.0",
    "matplotlib==3.11.2",
]
dev = [
    { include-group = "analysis" },
    "hypothesis==6.170.8",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pylint==4.1.3",
    "black==26.10.1",
]

[tool.uv]
package = false
default-groups = ["dev"]
required-version = ">=0.13.5"

[tool.pytest.ini_options]
markers = ["slow: runs over a full committed extract"]
